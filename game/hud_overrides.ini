# dreamcomp HUD overrides (docs/HUD.md): rect in the console's 640x480 coordinates
# before correction, anchor left|center|right|stretch|auto, tcw = texture words of
# the element's pieces (none: any). Later lines win. Edited with F1 in game and
# promoted with tools/hud_promote.py.
#
# Menu cursor box (1/w 100, texture 0x0c0d25f0): a 2D overlay the game places over items that
# are themselves 3D quads (letter grid on Enter Your Initials, menu lists). Those items follow
# the widened camera, i.e. keep their 4:3 distance from the screen centre, so the box must too:
# anchored by thirds it kept its distance from the screen edge and sat off to the left/right of
# the outer letter columns at 21:9 (cherryduck, 2026-10-15; ta_dump at guest frame 2000).
rect=0,0,640,480 anchor=center tcw=0x0c0d25f0
