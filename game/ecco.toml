# Ecco the Dolphin: Defender of the Future (Europe), MK-5103350 V1.003 -- dreamcomp game config.
# Format: dreamcomp/engine/docs/game-config.md. Measured on the owner's disc; never commit disc data.

[game]
id = "ecco"
title = "Ecco the Dolphin: Defender of the Future"
region = "Europe"
product = "MK-5103350"

[disc]
sha1_1st_read = "e6b209962f6d3d9565a4a6f8d430f1e921d264c0"   # the boot file this config was measured against

[binary]
path = "extracted/fs/1ST_READ.BIN"   # written by tools/dc.py setup, git-ignored
load_address = 0x8C010000
# CodeWarrior links this binary at its P1 load address, unlike the SHC titles (0x0C010000):
# 62,088 image-range words in 0.BIN are 0x8Cxxxxxx pointers against 734 0x0Cxxxxxx (2026-10-15).
# With 0x0C010000 the pointer pass missed the static-constructor table (80 untranslated calls
# from 0x0C0171AE in the first 1800 frames).
link_address = 0x8C010000
entry = 0x8C010000

# [[relocations]] and [functions] extra: paste from --suggest-config, with a comment saying how
# each was found. [hooks]: see dreamcomp docs/HOOKS.md.

# Katana copies its exception/interrupt stubs below the load address at boot (playbook T1); VBR
# is 0x8C000000, interrupts enter at VBR+0x600. Found with --suggest-config (2026-10-15): 14,020
# untranslated calls to 0x8C000600 in 1800 frames. The 0x600 copy is the last 44 bytes of the
# same 56-byte block (the report's "bytes match the image at 0x8c2bf338 for 44 bytes"); the
# suggester's 48-byte minimum skipped it.
[[relocations]]  # RAM 0x8c000100 reproduces image 0x8c2bf304 for 56 bytes
source = 0x8C2BF304
size = 0x38
dest = 0x8C000100

[[relocations]]  # RAM 0x8c000400 reproduces image 0x8c2bf304 for 56 bytes
source = 0x8C2BF304
size = 0x38
dest = 0x8C000400

[[relocations]]  # RAM 0x8c000600 reproduces image 0x8c2bf338 for 44 bytes (interrupt entry)
source = 0x8C2BF338
size = 0x2C
dest = 0x8C000600

[functions]
